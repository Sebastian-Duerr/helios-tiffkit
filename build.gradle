plugins {
    id "com.android.library"
}

android {
    namespace "org.beyka.tiffbitmapfactory"
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        // Keep ABI coverage close to the original published artifact.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK=src/main/jni/Application.mk"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Required to produce 16 KB-compatible native binaries.
    ndkVersion "28.0.13004108"

    externalNativeBuild {
        ndkBuild {
            path file("src/main/jni/Android.mk")
        }
    }

    sourceSets {
        main {
            // Build via ndkBuild from src/main/jni.
            jni.srcDirs = []
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
